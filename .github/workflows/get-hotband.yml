name: get_hotband

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run on'
        required: false
        default: 'master'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 2
    steps:
      - name: Debug - Show current time
        run: |
          echo "Current UTC time: $(date -u)"
          echo "Current Beijing time: $(TZ='Asia/Shanghai' date)"
          echo "Workflow triggered by: ${{ github.event_name }}"
          echo "Current branch: ${{ github.ref }}"

      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py
        run: |
          python main.py

      - name: Create timestamp
        id: timestamp
        run: |
          echo "timestamp=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Commit and push snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "snapshot: ${{ steps.timestamp.outputs.timestamp }}"
          files: snapshot/*
          skip_dirty_check: true