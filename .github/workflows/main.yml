name: get_hot_band

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
    contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: run main.py
      run: |
        python main.py

    - name: Create timestamp
      id: timestamp
      run: |
        echo "timestamp=$(TZ='Asia/Shanghai' date +'%Y%m%d%H')" >> $GITHUB_OUTPUT

    - name: Commit and push snapshot
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "snapshot: ${{ steps.timestamp.outputs.timestamp }}"
        files: snapshot/*
        
